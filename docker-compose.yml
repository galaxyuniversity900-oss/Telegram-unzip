services:
  tuzsbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tuzsbot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      WORK_DIR: /tmp/tuzsbot
    volumes:
      - tuzsbot-data:/tmp/tuzsbot
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_swappiness: 0
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  tuzsbot-data:
